    <!-- Invoice lines -->
    <rect x="28" y="38" width="38" height="5" rx="2.5" fill="white" opacity="0.9"/>
    <rect x="28" y="50" width="30" height="5" rx="2.5" fill="white" opacity="0.7"/>
