<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="iconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1E40AF"/>
    </linearGradient>
    
    <linearGradient id="iconAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#iconBlue)"/>
  
  <!-- Abstract E with dynamic arrow -->
  <g fill="white">
    <!-- Top bar -->
    <rect x="24" y="24" width="44" height="10" rx="2"/>
    <!-- Middle bar with arrow -->
    <polygon points="24,45 64,45 74,50 64,55 24,55"/>
    <!-- Bottom bar -->
    <rect x="24" y="66" width="44" height="10" rx="2"/>
    <!-- Vertical stem -->
    <rect x="24" y="24" width="12" height="52" rx="2"/>
  </g>
  
  <!-- Speed lines -->
  <g stroke="url(#iconAccent)" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="78" y1="32" x2="88" y2="32"/>
    <line x1="82" y1="44" x2="92" y2="44"/>
    <line x1="78" y1="74" x2="88" y2="74"/>
  </g>
</svg>
