<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <!-- Modern gradient with deeper blues -->
    <linearGradient id="modernBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1E40AF"/>
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    
    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Mark: Abstract "E" merged with lightning bolt / speed lines -->
  <g>
    <!-- Main rounded square container -->
    <rect x="12" y="12" width="96" height="96" rx="20" fill="url(#modernBlue)"/>
    
    <!-- Abstract E with dynamic angle - representing speed/easy -->
    <g fill="white">
      <!-- Top bar of E -->
      <rect x="32" y="32" width="48" height="10" rx="2"/>
      <!-- Middle bar - extended with arrow/speed indicator -->
      <polygon points="32,55 72,55 80,60 72,65 32,65"/>
      <!-- Bottom bar of E -->
      <rect x="32" y="78" width="48" height="10" rx="2"/>
      <!-- Vertical stem of E -->
      <rect x="32" y="32" width="12" height="56" rx="2"/>
    </g>
    
    <!-- Speed lines / motion indicator -->
    <g stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="88" y1="40" x2="100" y2="40"/>
      <line x1="92" y1="52" x2="104" y2="52"/>
      <line x1="88" y1="86" x2="100" y2="86"/>
    </g>
  </g>
  
  <!-- Wordmark -->
  <g font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif">
    <!-- "Eazy" - medium weight -->
    <text x="125" y="62" font-size="38" font-weight="500" fill="#334155" letter-spacing="-1">Eazy</text>
    <!-- "Biz" - bold, blue -->
    <text x="210" y="62" font-size="38" font-weight="700" fill="#1E40AF" letter-spacing="-1">Biz</text>
    <!-- "Invoice" - lighter, smaller, underneath concept -->
    <text x="125" y="90" font-size="22" font-weight="400" fill="#64748B" letter-spacing="3">INVOICE</text>
  </g>
  
  <!-- Subtle connector dot -->
  <circle cx="283" y="55" r="3" fill="#3B82F6"/>
</svg>
