<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Main gradient for the icon -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    
    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E40AF" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Logo Mark: Stylized invoice/document with checkmark -->
  <g filter="url(#shadow)">
    <!-- Main document shape -->
    <path d="M20 15 L65 15 L80 30 L80 95 C80 100 76 105 70 105 L30 105 C24 105 20 100 20 95 Z" 
          fill="url(#blueGradient)"/>
    
    <!-- Folded corner -->
    <path d="M65 15 L65 30 L80 30 Z" fill="#93C5FD" opacity="0.6"/>
    
    <!-- Invoice lines representation -->
    <rect x="32" y="42" width="36" height="4" rx="2" fill="white" opacity="0.9"/>
    <rect x="32" y="54" width="28" height="4" rx="2" fill="white" opacity="0.7"/>
    <rect x="32" y="66" width="32" height="4" rx="2" fill="white" opacity="0.7"/>
    
    <!-- Checkmark circle - representing "easy" completion -->
    <circle cx="70" cy="90" r="18" fill="#10B981"/>
    <path d="M62 90 L67 95 L78 84" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Wordmark -->
  <g>
    <!-- "Easy" in lighter weight -->
    <text x="100" y="72" font-family="'Avenir Next', 'Segoe UI', sans-serif" font-size="42" font-weight="500" fill="#64748B">Easy</text>
    
    <!-- "Billing" in bold blue -->
    <text x="195" y="72" font-family="'Avenir Next', 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#1D4ED8">Billing</text>
  </g>
</svg>
